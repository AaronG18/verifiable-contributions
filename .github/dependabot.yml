# Version updates are deliberately disabled for third-party actions. Every
# `uses:` reference is pinned to a full commit SHA (see SECURITY.md), so a bot
# PR chasing a moving major tag would reintroduce exactly the mutable reference
# we removed. Per GitHub's Dependabot options reference, setting
# open-pull-requests-limit to 0 disables version updates only; security updates
# have a separate fixed limit that this option cannot configure, so CVE fixes
# still arrive automatically through "Dependabot security updates" in the repo
# settings. SHA bumps are done deliberately, in a reviewed PR.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
